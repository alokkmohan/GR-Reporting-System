<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meeting Timeline</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .tl-header { background: linear-gradient(135deg,#1a2a4a 0%,#2c3e6b 100%); color:#fff; border-radius: var(--radius); padding:16px; margin-bottom:20px; }
    .tl-header-label { font-size:11px; opacity:0.75; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; }
    .tl-header-title { font-size:18px; font-weight:800; margin-top:4px; }
    .tl-header-meta { font-size:12px; opacity:0.8; margin-top:4px; }

    .timeline { position:relative; padding-left:28px; }
    .timeline::before { content:''; position:absolute; left:11px; top:0; bottom:0; width:2px; background: linear-gradient(to bottom,#27ae60,#e67e22,#e74c3c); opacity:0.3; border-radius:2px; }

    .tl-node { position:relative; margin-bottom:20px; }
    .tl-dot { position:absolute; left:-28px; width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; border:2.5px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,0.18); }
    .tl-dot.planned    { background:#3498db; color:#fff; }
    .tl-dot.conducted  { background:#27ae60; color:#fff; }
    .tl-dot.not-done   { background:#e67e22; color:#fff; }
    .tl-dot.pending    { background:#95a5a6; color:#fff; border-style:dashed; }

    .tl-card { background:#fff; border-radius:10px; box-shadow:0 1px 6px rgba(0,0,0,0.08); overflow:hidden; }
    .tl-card-head { padding:10px 14px 8px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #f3f4f6; }
    .tl-date { font-size:12px; font-weight:800; color:#374151; }
    .tl-badge-planned  { background:#dbeafe; color:#1e3a5f; font-size:10px; font-weight:800; padding:2px 8px; border-radius:8px; }
    .tl-badge-done     { background:#dcfce7; color:#065f46; font-size:10px; font-weight:800; padding:2px 8px; border-radius:8px; }
    .tl-badge-notdone  { background:#fef3c7; color:#92400e; font-size:10px; font-weight:800; padding:2px 8px; border-radius:8px; }
    .tl-badge-pending  { background:#f1f5f9; color:#64748b; font-size:10px; font-weight:800; padding:2px 8px; border-radius:8px; }

    .tl-card-body { padding:10px 14px 12px; }
    .tl-who { font-size:14px; font-weight:800; color:#1a1a2e; }
    .tl-purpose { font-size:12px; color:var(--muted); margin-top:2px; }

    .tl-section { margin-top:10px; padding-top:8px; border-top:1px dashed #e5e7eb; }
    .tl-section-label { font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); margin-bottom:4px; }
    .tl-section-text { font-size:12px; color:#374151; line-height:1.5; }

    .tl-attendee-alt { background:#fef9c3; border:1px solid #fde68a; border-radius:6px; padding:6px 10px; font-size:12px; color:#92400e; font-weight:600; margin-top:8px; }
    .tl-outcome-done  { background:#ecfdf5; border:1px solid #a7f3d0; border-radius:6px; padding:6px 10px; font-size:12px; color:#065f46; font-weight:700; margin-top:8px; }
    .tl-outcome-fu    { background:#fffbeb; border:1px solid #fcd34d; border-radius:6px; padding:6px 10px; font-size:12px; color:#92400e; font-weight:700; margin-top:8px; }
    .tl-not-done-box  { background:#fef3c7; border:1px solid #fcd34d; border-radius:6px; padding:6px 10px; font-size:12px; color:#92400e; font-weight:700; margin-top:8px; }

    .tl-connector { text-align:center; margin:4px 0; font-size:18px; color:#cbd5e1; }
    .empty-state { text-align:center; padding:40px 16px; color:var(--muted); }
    .rel-tag { display:inline-block; padding:2px 8px; border-radius:8px; font-size:10px; font-weight:800; margin-top:4px; }
    .rel-Positive { background:#dcfce7; color:#065f46; }
    .rel-Neutral { background:#dbeafe; color:#1e3a5f; }
    .rel-Cold { background:#f1f5f9; color:#64748b; }
    .rel-Not.Reachable,.rel-not-reachable { background:#fef2f2; color:var(--danger); }

    .tl-tabs{display:flex;gap:6px;margin-bottom:16px;}
    .tl-tab{flex:1;padding:8px;border:1.5px solid var(--border);border-radius:8px;background:#fff;font-size:13px;cursor:pointer;text-align:center;font-weight:600;}
    .tl-tab.active{background:#1a2a4a;color:#fff;border-color:#1a2a4a;}

    /* Click-to-expand */
    .tl-card { cursor:pointer; }
    .tl-card-head { position:relative; }
    .tl-expand-icon { font-size:16px; color:var(--muted); transition:transform 0.2s; line-height:1; }
    .tl-details { display:none; border-top:1px dashed #e5e7eb; padding-top:10px; margin-top:8px; }
    .tl-details.open { display:block; }
    .tl-expand-icon.open { transform: rotate(180deg); }
    .tl-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.12); }

    /* MoM button */
    .mom-btn { display:inline-flex; align-items:center; gap:6px; background:#1a2a4a; color:#fff; border:none; border-radius:7px; padding:7px 12px; font-size:12px; font-weight:700; cursor:pointer; margin-top:10px; text-decoration:none; transition:background 0.2s; }
    .mom-btn:hover { background:#243352; }
    .mom-btn-open { background:#059669; }
    .mom-btn-open:hover { background:#047857; }
    .mom-btn-loading { opacity:0.7; cursor:not-allowed; }

    /* Action Items tab */
    .ai-tab-table{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border-radius:var(--radius);box-shadow:0 1px 6px rgba(0,0,0,0.07);overflow:hidden;}
    .ai-tab-table th{background:#f9fafb;padding:9px 10px;text-align:left;font-weight:700;border-bottom:2px solid var(--border);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;white-space:nowrap;}
    .ai-tab-table td{padding:9px 10px;border-bottom:1px solid #f3f4f6;vertical-align:middle;font-size:12px;}
    .ai-tab-table tr:last-child td{border-bottom:none;}

    /* Summary tab */
    .sum-card{background:#fff;border-radius:var(--radius);box-shadow:0 1px 6px rgba(0,0,0,0.07);padding:18px 16px;margin-bottom:12px;}
    .sum-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f3f4f6;font-size:13px;}
    .sum-row:last-child{border-bottom:none;}
    .sum-label{color:var(--muted);font-weight:600;font-size:12px;}
    .sum-val{font-weight:800;color:#1a1a2e;}
    .progress-bar-wrap{background:#f1f5f9;border-radius:8px;height:10px;overflow:hidden;margin-top:10px;}
    .progress-bar-fill{height:100%;background:#27ae60;border-radius:8px;transition:width 0.4s;}
  </style>
</head>
<body>
  <nav class="navbar">
    <button class="hamburger-btn" onclick="toggleSidebar()">&#9776;</button>
    <span class="logo">Meeting Timeline</span>
    <span class="nav-user" id="navUser"></span>
  </nav>
  <div class="app-layout">
  <div id="sidebarMount"></div>
  <div class="main-content">

    <div id="loadingState" style="padding:40px;text-align:center;"><div class="spinner" style="margin:0 auto;"></div><p class="text-muted mt-8">Loading timeline...</p></div>
    <div id="mainContent" style="display:none;">
      <div class="tl-header" id="tlHeader"></div>

      <!-- Tabs -->
      <div class="tl-tabs">
        <button class="tl-tab active" id="tTabTimeline" onclick="switchTlTab('timeline')">Timeline</button>
        <button class="tl-tab" id="tTabActions" onclick="switchTlTab('actions')">Action Items</button>
        <button class="tl-tab" id="tTabSummary" onclick="switchTlTab('summary')">Summary</button>
      </div>

      <!-- Tab: Timeline -->
      <div id="tabTimeline">
        <div class="timeline" id="timelineContainer"></div>
      </div>

      <!-- Tab: Action Items -->
      <div id="tabActions" style="display:none;">
        <div id="actionsTabContent"></div>
      </div>

      <!-- Tab: Summary -->
      <div id="tabSummary" style="display:none;">
        <div id="summaryTabContent"></div>
      </div>
    </div>
    <div id="errorState" class="hidden">
      <div class="empty-state">
        <div style="font-size:32px;margin-bottom:8px;"></div>
        <div style="font-weight:700;">Timeline not found</div>
        <p>Plan ID is invalid or data not available.</p>
        <button class="btn btn-outline mt-8" onclick="window.location.href='planner.html'">Back to Planner</button>
      </div>
    </div>

  </div>
  </div>
  <script src="common.js"></script>
  <script>
    var session = requireAuth();
    renderSidebar('planner');
    var planId = new URLSearchParams(window.location.search).get('plan_id') || '';

    if (!planId) {
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('errorState').classList.remove('hidden');
    } else {
      fetch(APP_URL, { method:'POST', body: JSON.stringify({ action:'getMeetingTimeline', token: grToken(), plan_id: planId }) })
        .then(function(r) { return r.json(); }).then(function(res) {
          document.getElementById('loadingState').style.display = 'none';
          if (!res.success || !res.data || !res.data.length) {
            document.getElementById('errorState').classList.remove('hidden'); return;
          }
          renderTimeline(res.data);
          renderActionItemsTab(res.data);
          renderSummaryTab(res.data);
          document.getElementById('mainContent').style.display = '';
        }).catch(function() {
          document.getElementById('loadingState').style.display = 'none';
          document.getElementById('errorState').classList.remove('hidden');
        });
    }

    function switchTlTab(tab) {
      ['timeline','actions','summary'].forEach(function(t) {
        document.getElementById('tabTimeline').style.display = t === 'timeline' ? '' : 'none';
        document.getElementById('tabActions').style.display = t === 'actions' ? '' : 'none';
        document.getElementById('tabSummary').style.display = t === 'summary' ? '' : 'none';
      });
      // Set correct display for clicked tab
      document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).style.display = '';
      ['tTabTimeline','tTabActions','tTabSummary'].forEach(function(id) {
        document.getElementById(id).classList.remove('active');
      });
      var map = { timeline: 'tTabTimeline', actions: 'tTabActions', summary: 'tTabSummary' };
      document.getElementById(map[tab]).classList.add('active');
    }

    function renderActionItemsTab(data) {
      var today = new Date(); today.setHours(0,0,0,0);
      var rows = '';
      var rowNum = 0;
      data.forEach(function(item) {
        if (!item.meeting || item.meeting.meeting_conducted !== 'YES') return;
        var items = [];
        try { items = JSON.parse(item.meeting.action_items || '[]'); } catch(e) {}
        items.forEach(function(ai) {
          if (!ai.action) return;
          rowNum++;
          var due = ai.due_date ? new Date(ai.due_date) : null;
          if (due) due.setHours(0,0,0,0);
          var isOverdue = due && due < today;
          var dueStr = ai.due_date ? fmtDate(ai.due_date) : '-';
          rows += '<tr>'
            + '<td>' + rowNum + '</td>'
            + '<td style="' + (isOverdue ? 'color:#e74c3c;font-weight:700;' : '') + '">' + esc(ai.action) + '</td>'
            + '<td>' + esc(ai.owner || '-') + '</td>'
            + '<td style="' + (isOverdue ? 'color:#e74c3c;font-weight:700;' : '') + '">' + dueStr + (isOverdue ? ' !' : '') + '</td>'
            + '<td style="font-size:11px;color:var(--muted);">' + esc(item.plan.stakeholder_name || '') + '</td>'
            + '</tr>';
        });
      });
      if (!rows) {
        document.getElementById('actionsTabContent').innerHTML = '<div style="text-align:center;padding:32px;color:var(--muted);">No action items recorded in this chain.</div>';
        return;
      }
      document.getElementById('actionsTabContent').innerHTML = '<div style="overflow-x:auto;">'
        + '<table class="ai-tab-table">'
        + '<thead><tr><th>#</th><th>Action</th><th>Owner</th><th>Due Date</th><th>Meeting</th></tr></thead>'
        + '<tbody>' + rows + '</tbody>'
        + '</table></div>';
    }

    function renderSummaryTab(data) {
      var today = new Date(); today.setHours(0,0,0,0);
      var totalCount = data.length;
      var conductedCount = 0, notConductedCount = 0, plannedCount = 0;
      var dates = [];
      data.forEach(function(item) {
        if (item.plan.meeting_date) dates.push(new Date(item.plan.meeting_date));
        if (item.plan.status === 'conducted') conductedCount++;
        else if (item.plan.status === 'not_conducted') notConductedCount++;
        else plannedCount++;
      });
      dates.sort(function(a,b) { return a-b; });
      var firstDate = dates.length ? fmtDate(dates[0].toISOString().split('T')[0]) : '-';
      var latestDate = dates.length ? fmtDate(dates[dates.length-1].toISOString().split('T')[0]) : '-';
      var first = data[0].plan;
      var pct = totalCount > 0 ? Math.round((conductedCount / totalCount) * 100) : 0;

      document.getElementById('summaryTabContent').innerHTML = '<div class="sum-card">'
        + '<div class="sum-row"><span class="sum-label">Total Meetings in Chain</span><span class="sum-val">' + totalCount + '</span></div>'
        + '<div class="sum-row"><span class="sum-label">Conducted</span><span class="sum-val" style="color:#27ae60;">' + conductedCount + '</span></div>'
        + '<div class="sum-row"><span class="sum-label">Not Conducted</span><span class="sum-val" style="color:#e67e22;">' + notConductedCount + '</span></div>'
        + '<div class="sum-row"><span class="sum-label">Still Planned</span><span class="sum-val" style="color:#3498db;">' + plannedCount + '</span></div>'
        + '<div class="sum-row"><span class="sum-label">First Meeting Date</span><span class="sum-val">' + firstDate + '</span></div>'
        + '<div class="sum-row"><span class="sum-label">Latest Activity</span><span class="sum-val">' + latestDate + '</span></div>'
        + '<div class="sum-row"><span class="sum-label">Stakeholder</span><span class="sum-val">' + esc(first.stakeholder_name || '-') + '</span></div>'
        + '<div style="margin-top:10px;">'
        + '<div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:4px;"><span>Progress</span><span>' + pct + '% conducted</span></div>'
        + '<div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:' + pct + '%;"></div></div>'
        + '</div>'
        + '</div>';
    }

    function toggleNode(nodeId) {
      var details = document.getElementById('det-' + nodeId);
      var icon    = document.getElementById('ico-' + nodeId);
      if (!details) return;
      var open = details.classList.toggle('open');
      if (icon) icon.classList.toggle('open', open);
    }

    function createMoM(submissionId, btnId) {
      var btn = document.getElementById(btnId);
      if (!btn || btn.disabled) return;
      btn.disabled = true;
      btn.textContent = 'Creating...';
      btn.classList.add('mom-btn-loading');
      fetch(APP_URL, { method:'POST', body: JSON.stringify({ action:'createMeetingDoc', token: grToken(), submission_id: submissionId }) })
        .then(function(r) { return r.json(); }).then(function(res) {
          if (res.success && res.url) {
            btn.outerHTML = '<a href="' + esc(res.url) + '" target="_blank" class="mom-btn mom-btn-open">'
              + '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>'
              + 'Open Minutes Doc</a>';
          } else {
            btn.disabled = false; btn.textContent = 'Create Minutes Doc';
            btn.classList.remove('mom-btn-loading');
            alert(res.message || 'Failed to create document.');
          }
        }).catch(function() {
          btn.disabled = false; btn.textContent = 'Create Minutes Doc';
          btn.classList.remove('mom-btn-loading');
          alert('Network error. Please try again.');
        });
    }

    function renderTimeline(data) {
      var first = data[0].plan;
      document.getElementById('tlHeader').innerHTML =
        '<div class="tl-header-label">Meeting Chain Timeline</div>'
        + '<div class="tl-header-title">' + esc(first.stakeholder_type ? first.stakeholder_type + ' - ' : '') + esc(first.stakeholder_name || '') + '</div>'
        + '<div class="tl-header-meta">' + esc(first.meeting_purpose || '') + (first.level_of_meeting ? '  -  ' + first.level_of_meeting : '')
        + '  -  ' + data.length + ' meeting' + (data.length > 1 ? 's' : '') + ' in chain</div>';

      var html = '';
      data.forEach(function(item, idx) {
        var plan = item.plan;
        var mtg = item.meeting;
        var status = plan.status;
        var nodeId = 'n' + idx;
        var dotClass = status === 'conducted' ? 'conducted' : status === 'not_conducted' ? 'not-done' : status === 'planned' ? 'planned' : 'pending';
        var dotIcon = status === 'conducted' ? '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
          : status === 'not_conducted' ? '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'
          : (idx + 1);

        var badgeClass = status === 'conducted' ? 'tl-badge-done' : status === 'not_conducted' ? 'tl-badge-notdone' : 'tl-badge-pending';
        var badgeLabel = status === 'conducted' ? 'Conducted' : status === 'not_conducted' ? 'Not Conducted' : 'Planned';

        html += '<div class="tl-node">';
        html += '<div class="tl-dot ' + dotClass + '">' + dotIcon + '</div>';
        html += '<div class="tl-card" onclick="toggleNode(\'' + nodeId + '\')">';

        // Card head: date + badge + expand icon
        html += '<div class="tl-card-head">';
        html += '<span class="tl-date">' + fmtDate(plan.meeting_date) + (plan.meeting_time ? '  ' + plan.meeting_time : '') + '</span>';
        html += '<div style="display:flex;align-items:center;gap:8px;">';
        html += '<span class="' + badgeClass + '">' + badgeLabel + '</span>';
        html += '<span class="tl-expand-icon" id="ico-' + nodeId + '">v</span>';
        html += '</div>';
        html += '</div>';

        // Card body — always visible: who + purpose
        html += '<div class="tl-card-body">';
        html += '<div class="tl-who">' + esc(plan.stakeholder_name || '') + '</div>';
        html += '<div class="tl-purpose">' + esc(plan.stakeholder_type || '') + (plan.meeting_purpose ? '  -  ' + esc(plan.meeting_purpose) : '') + '</div>';
        if (plan.level_of_meeting) html += '<div class="tl-purpose">' + esc(plan.level_of_meeting) + (plan.block_cluster ? ' - ' + esc(plan.block_cluster) : '') + '</div>';
        if (plan.location) html += '<div class="tl-purpose" style="color:#2563eb;">Location: ' + esc(plan.location) + '</div>';
        if (plan.meeting_mode === 'online' && plan.meet_link) html += '<div class="tl-purpose"><a href="' + esc(plan.meet_link) + '" target="_blank" style="color:#2563eb;font-size:11px;">Join Online Meeting</a></div>';

        // Expandable details section
        html += '<div class="tl-details" id="det-' + nodeId + '" onclick="event.stopPropagation()">';

        if (plan.notes) {
          html += '<div class="tl-section"><div class="tl-section-label">Plan Notes</div><div class="tl-section-text">' + esc(plan.notes) + '</div></div>';
        }

        // Meeting details (if conducted or not conducted)
        if (mtg) {
          if (mtg.meeting_conducted === 'YES') {
            if (mtg.attendee_type === 'alternate' && mtg.actual_attendee_name) {
              html += '<div class="tl-attendee-alt">' + esc(mtg.actual_attendee_name) + ' (on behalf of planned stakeholder)</div>';
            }
            if (mtg.key_discussion_points) {
              html += '<div class="tl-section"><div class="tl-section-label">Key Discussion Points</div><div class="tl-section-text">' + esc(mtg.key_discussion_points) + '</div></div>';
            }
            if (mtg.outcome) {
              html += '<div class="tl-section"><div class="tl-section-label">Outcome</div><div class="tl-section-text">' + esc(mtg.outcome) + '</div></div>';
            }
            if (mtg.next_action) {
              html += '<div class="tl-section"><div class="tl-section-label">Next Action</div><div class="tl-section-text">' + esc(mtg.next_action) + (mtg.responsible_person ? ' — ' + esc(mtg.responsible_person) : '') + '</div></div>';
            }
            if (mtg.remark) {
              html += '<br><span class="rel-tag rel-' + mtg.remark.replace(' ','') + '">' + esc(mtg.remark) + '</span>';
            }
            if (mtg.meeting_status === 'completed') {
              html += '<div class="tl-outcome-done" style="margin-top:8px;">Meeting chain completed at this point.</div>';
            } else if (mtg.meeting_status === 'follow_up_required') {
              html += '<div class="tl-outcome-fu" style="margin-top:8px;">Follow-up required - next planned: ' + fmtDate(mtg.followup_date) + '</div>';
            }
            // MoM button
            var momBtnId = 'mom-' + nodeId;
            if (mtg.mom_doc_link) {
              html += '<a href="' + esc(mtg.mom_doc_link) + '" target="_blank" class="mom-btn mom-btn-open">'
                + '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>'
                + 'Open Minutes Doc</a>';
            } else {
              html += '<button id="' + momBtnId + '" class="mom-btn" onclick="createMoM(\'' + esc(mtg.submission_id) + '\',\'' + momBtnId + '\')">'
                + '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>'
                + 'Create Minutes Doc</button>';
            }
          } else if (mtg.meeting_conducted === 'NO') {
            var reason = mtg.reason_not_conducted || 'Not specified';
            html += '<div class="tl-not-done-box">Not conducted: ' + esc(reason);
            if (mtg.followup_date) html += ' - Rescheduled to ' + fmtDate(mtg.followup_date);
            html += '</div>';
            if (mtg.followup_notes) {
              html += '<div class="tl-section"><div class="tl-section-text">' + esc(mtg.followup_notes) + '</div></div>';
            }
          }
        }

        html += '</div></div></div></div>';

        // Connector arrow between nodes
        if (idx < data.length - 1) {
          html += '<div class="tl-connector">|</div>';
        }
      });

      document.getElementById('timelineContainer').innerHTML = html;
    }
  </script>
