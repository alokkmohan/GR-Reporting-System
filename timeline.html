<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meeting Timeline</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .tl-header { background: linear-gradient(135deg,#1a2a4a 0%,#2c3e6b 100%); color:#fff; border-radius: var(--radius); padding:16px; margin-bottom:20px; }
    .tl-header-label { font-size:11px; opacity:0.75; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; }
    .tl-header-title { font-size:18px; font-weight:800; margin-top:4px; }
    .tl-header-meta { font-size:12px; opacity:0.8; margin-top:4px; }

    .timeline { position:relative; padding-left:28px; }
    .timeline::before { content:''; position:absolute; left:11px; top:0; bottom:0; width:2px; background: linear-gradient(to bottom,#27ae60,#e67e22,#e74c3c); opacity:0.3; border-radius:2px; }

    .tl-node { position:relative; margin-bottom:20px; }
    .tl-dot { position:absolute; left:-28px; width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; border:2.5px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,0.18); }
    .tl-dot.planned    { background:#3498db; color:#fff; }
    .tl-dot.conducted  { background:#27ae60; color:#fff; }
    .tl-dot.not-done   { background:#e67e22; color:#fff; }
    .tl-dot.pending    { background:#95a5a6; color:#fff; border-style:dashed; }

    .tl-card { background:#fff; border-radius:10px; box-shadow:0 1px 6px rgba(0,0,0,0.08); overflow:hidden; }
    .tl-card-head { padding:10px 14px 8px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #f3f4f6; }
    .tl-date { font-size:12px; font-weight:800; color:#374151; }
    .tl-badge-planned  { background:#dbeafe; color:#1e3a5f; font-size:10px; font-weight:800; padding:2px 8px; border-radius:8px; }
    .tl-badge-done     { background:#dcfce7; color:#065f46; font-size:10px; font-weight:800; padding:2px 8px; border-radius:8px; }
    .tl-badge-notdone  { background:#fef3c7; color:#92400e; font-size:10px; font-weight:800; padding:2px 8px; border-radius:8px; }
    .tl-badge-pending  { background:#f1f5f9; color:#64748b; font-size:10px; font-weight:800; padding:2px 8px; border-radius:8px; }

    .tl-card-body { padding:10px 14px 12px; }
    .tl-who { font-size:14px; font-weight:800; color:#1a1a2e; }
    .tl-purpose { font-size:12px; color:var(--muted); margin-top:2px; }

    .tl-section { margin-top:10px; padding-top:8px; border-top:1px dashed #e5e7eb; }
    .tl-section-label { font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); margin-bottom:4px; }
    .tl-section-text { font-size:12px; color:#374151; line-height:1.5; }

    .tl-attendee-alt { background:#fef9c3; border:1px solid #fde68a; border-radius:6px; padding:6px 10px; font-size:12px; color:#92400e; font-weight:600; margin-top:8px; }
    .tl-outcome-done  { background:#ecfdf5; border:1px solid #a7f3d0; border-radius:6px; padding:6px 10px; font-size:12px; color:#065f46; font-weight:700; margin-top:8px; }
    .tl-outcome-fu    { background:#fffbeb; border:1px solid #fcd34d; border-radius:6px; padding:6px 10px; font-size:12px; color:#92400e; font-weight:700; margin-top:8px; }
    .tl-not-done-box  { background:#fef3c7; border:1px solid #fcd34d; border-radius:6px; padding:6px 10px; font-size:12px; color:#92400e; font-weight:700; margin-top:8px; }

    .tl-connector { text-align:center; margin:4px 0; font-size:18px; color:#cbd5e1; }
    .empty-state { text-align:center; padding:40px 16px; color:var(--muted); }
    .rel-tag { display:inline-block; padding:2px 8px; border-radius:8px; font-size:10px; font-weight:800; margin-top:4px; }
    .rel-Positive { background:#dcfce7; color:#065f46; }
    .rel-Neutral { background:#dbeafe; color:#1e3a5f; }
    .rel-Cold { background:#f1f5f9; color:#64748b; }
    .rel-Not.Reachable,.rel-not-reachable { background:#fef2f2; color:var(--danger); }
  </style>
</head>
<body>
  <nav class="navbar">
    <button class="hamburger-btn" onclick="toggleSidebar()">&#9776;</button>
    <span class="logo">Meeting Timeline</span>
    <span class="nav-user" id="navUser"></span>
  </nav>
  <div class="app-layout">
  <div id="sidebarMount"></div>
  <div class="main-content">

    <div id="loadingState" style="padding:40px;text-align:center;"><div class="spinner" style="margin:0 auto;"></div><p class="text-muted mt-8">Loading timeline...</p></div>
    <div id="mainContent" style="display:none;">
      <div class="tl-header" id="tlHeader"></div>
      <div class="timeline" id="timelineContainer"></div>
    </div>
    <div id="errorState" class="hidden">
      <div class="empty-state">
        <div style="font-size:32px;margin-bottom:8px;">&#128197;</div>
        <div style="font-weight:700;">Timeline not found</div>
        <p>Plan ID is invalid or data not available.</p>
        <button class="btn btn-outline mt-8" onclick="window.location.href='planner.html'">Back to Planner</button>
      </div>
    </div>

  </div>
  </div>
  <script src="common.js"></script>
  <script>
    var session = requireAuth();
    renderSidebar('planner');
    var planId = new URLSearchParams(window.location.search).get('plan_id') || '';

    if (!planId) {
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('errorState').classList.remove('hidden');
    } else {
      fetch(APP_URL, { method:'POST', body: JSON.stringify({ action:'getMeetingTimeline', token: grToken(), plan_id: planId }) })
        .then(function(r) { return r.json(); }).then(function(res) {
          document.getElementById('loadingState').style.display = 'none';
          if (!res.success || !res.data || !res.data.length) {
            document.getElementById('errorState').classList.remove('hidden'); return;
          }
          renderTimeline(res.data);
          document.getElementById('mainContent').style.display = '';
        }).catch(function() {
          document.getElementById('loadingState').style.display = 'none';
          document.getElementById('errorState').classList.remove('hidden');
        });
    }

    function renderTimeline(data) {
      var first = data[0].plan;
      document.getElementById('tlHeader').innerHTML =
        '<div class="tl-header-label">&#128336; Meeting Chain Timeline</div>'
        + '<div class="tl-header-title">' + esc(first.stakeholder_type ? first.stakeholder_type + ' — ' : '') + esc(first.stakeholder_name || '') + '</div>'
        + '<div class="tl-header-meta">' + esc(first.meeting_purpose || '') + (first.level_of_meeting ? '  ·  ' + first.level_of_meeting : '')
        + '  ·  ' + data.length + ' meeting' + (data.length > 1 ? 's' : '') + ' in chain</div>';

      var html = '';
      data.forEach(function(item, idx) {
        var plan = item.plan;
        var mtg = item.meeting;
        var status = plan.status;
        var dotClass = status === 'conducted' ? 'conducted' : status === 'not_conducted' ? 'not-done' : status === 'planned' ? 'planned' : 'pending';
        var dotIcon = status === 'conducted' ? '✓' : status === 'not_conducted' ? '✗' : (idx + 1);

        html += '<div class="tl-node">';
        html += '<div class="tl-dot ' + dotClass + '">' + dotIcon + '</div>';
        html += '<div class="tl-card">';

        // Card head: date + badge
        var badgeClass = status === 'conducted' ? 'tl-badge-done' : status === 'not_conducted' ? 'tl-badge-notdone' : status === 'planned' ? 'tl-badge-pending' : 'tl-badge-pending';
        var badgeLabel = status === 'conducted' ? '✓ Conducted' : status === 'not_conducted' ? '✗ Not Conducted' : '⏳ Planned';
        html += '<div class="tl-card-head">';
        html += '<span class="tl-date">' + fmtDate(plan.meeting_date) + (plan.meeting_time ? '  ' + plan.meeting_time : '') + '</span>';
        html += '<span class="' + badgeClass + '">' + badgeLabel + '</span>';
        html += '</div>';

        // Card body
        html += '<div class="tl-card-body">';
        html += '<div class="tl-who">' + esc(plan.stakeholder_name || '') + '</div>';
        html += '<div class="tl-purpose">' + esc(plan.stakeholder_type || '') + (plan.meeting_purpose ? '  ·  ' + esc(plan.meeting_purpose) : '') + '</div>';
        if (plan.level_of_meeting) html += '<div class="tl-purpose">' + esc(plan.level_of_meeting) + (plan.block_cluster ? ' — ' + esc(plan.block_cluster) : '') + '</div>';

        if (plan.notes) {
          html += '<div class="tl-section"><div class="tl-section-label">Plan Notes</div><div class="tl-section-text">' + esc(plan.notes) + '</div></div>';
        }

        // Meeting details (if conducted or not conducted)
        if (mtg) {
          if (mtg.meeting_conducted === 'YES') {
            // Who attended
            if (mtg.attendee_type === 'alternate' && mtg.actual_attendee_name) {
              html += '<div class="tl-attendee-alt">&#8645; ' + esc(mtg.actual_attendee_name) + ' (on behalf of planned stakeholder)</div>';
            }
            // Key points
            if (mtg.key_discussion_points) {
              html += '<div class="tl-section"><div class="tl-section-label">&#128221; Key Discussion Points</div><div class="tl-section-text">' + esc(mtg.key_discussion_points) + '</div></div>';
            }
            // Outcome
            if (mtg.outcome) {
              html += '<div class="tl-section"><div class="tl-section-label">&#127919; Outcome</div><div class="tl-section-text">' + esc(mtg.outcome) + '</div></div>';
            }
            // Relationship
            if (mtg.remark) {
              html += '<span class="rel-tag rel-' + mtg.remark.replace(' ','') + '">' + esc(mtg.remark) + '</span>';
            }
            // Meeting status
            if (mtg.meeting_status === 'completed') {
              html += '<div class="tl-outcome-done">&#9989; Meeting chain completed at this point.</div>';
            } else if (mtg.meeting_status === 'follow_up_required') {
              html += '<div class="tl-outcome-fu">&#128337; Follow-up required — next meeting planned for ' + fmtDate(mtg.followup_date) + '</div>';
            }
          } else if (mtg.meeting_conducted === 'NO') {
            var reason = mtg.reason_not_conducted || 'Not specified';
            html += '<div class="tl-not-done-box">&#10007; ' + esc(reason);
            if (mtg.followup_date) html += ' — Rescheduled to ' + fmtDate(mtg.followup_date);
            html += '</div>';
            if (mtg.followup_notes) {
              html += '<div class="tl-section"><div class="tl-section-text">' + esc(mtg.followup_notes) + '</div></div>';
            }
          }
        }

        html += '</div></div></div>';

        // Connector arrow between nodes
        if (idx < data.length - 1) {
          html += '<div class="tl-connector">&#8595;</div>';
        }
      });

      document.getElementById('timelineContainer').innerHTML = html;
    }
  </script>
</body>
</html>
