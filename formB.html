<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meeting Not Conducted</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .plan-banner { background: linear-gradient(135deg,#7c1818 0%,#a93226 100%); color:#fff; border-radius: var(--radius); padding: 14px 16px; margin-bottom:16px; }
    .plan-banner-label { font-size:11px; opacity:0.8; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; }
    .plan-banner-name { font-size:18px; font-weight:800; margin-top:3px; }
    .plan-banner-meta { font-size:12px; opacity:0.82; margin-top:3px; }
    .reason-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
    .reason-card { border:2px solid var(--border); border-radius:10px; padding:12px 8px; text-align:center; cursor:pointer; font-size:13px; font-weight:700; transition:all 0.15s; background:#fff; }
    .reason-card:hover { border-color:var(--primary); background:#fdf4f4; }
    .reason-card.selected { border-color:var(--danger); background:#fef2f2; color:var(--danger); }
    .postpone-box { background:#fffbeb; border:1.5px solid #fcd34d; border-radius:10px; padding:14px; margin-top:14px; }
    .postpone-box-title { font-size:13px; font-weight:800; color:#92400e; margin-bottom:10px; }
  </style>
</head>
<body>
  <nav class="navbar">
    <button class="hamburger-btn" onclick="toggleSidebar()">&#9776;</button>
    <span class="logo">Meeting Not Conducted</span>
    <span class="nav-user" id="navUser"></span>
  </nav>
  <div class="app-layout">
  <div id="sidebarMount"></div>
  <div class="main-content">

    <div id="successScreen" class="hidden">
      <div class="card success-screen">
        <div class="success-icon">&#10003;</div>
        <div class="card-title">Record Saved!</div>
        <p class="text-muted mt-8" id="successMsg">Entry recorded.</p>
        <button class="btn btn-primary mt-16" onclick="window.location.href='planner.html'">Back to Planner</button>
      </div>
    </div>

    <div id="formContainer">
      <div id="alertBox"></div>
      <div class="plan-banner" id="planBanner" style="display:none;">
        <div class="plan-banner-label">Planned Meeting</div>
        <div class="plan-banner-name" id="bannerName"></div>
        <div class="plan-banner-meta" id="bannerMeta"></div>
      </div>
      <div class="card">
        <div class="section-header">Why Was the Meeting Not Conducted?</div>
        <div class="form-group">
          <label class="form-label">Reason <span class="required">*</span></label>
          <div class="reason-grid">
            <div class="reason-card" onclick="selectReason(this,'Not Available')">Not Available</div>
            <div class="reason-card" onclick="selectReason(this,'Refused')">Refused</div>
            <div class="reason-card" onclick="selectReason(this,'Postponed')">Postponed</div>
            <div class="reason-card" onclick="selectReason(this,'Travel Issue')">Travel Issue</div>
            <div class="reason-card" onclick="selectReason(this,'Other')">Other</div>
          </div>
        </div>

        <div class="postpone-box hidden" id="postponeBox">
          <div class="postpone-box-title">Set Next Meeting Date</div>
          <div class="form-group" style="margin-bottom:10px;">
            <label class="form-label">Next Meeting Date <span class="required">*</span></label>
            <input type="date" id="next_date" class="form-control">
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <label class="form-label">Who to Meet?</label>
            <input type="text" id="next_stakeholder" class="form-control" placeholder="Same person or someone else (optional)">
          </div>
        </div>

        <div class="form-group" style="margin-top:14px;">
          <label class="form-label">Note (optional)</label>
          <textarea id="note" class="form-control" rows="2" placeholder="Any additional notes..."></textarea>
        </div>

        <button class="btn btn-primary" id="submitBtn" onclick="submitForm()" style="width:100%;margin-top:4px;">Save Record</button>
      </div>
    </div>

  </div>
  </div>
  <script src="common.js"></script>
  <script>
    var session = requireAuth();
    renderSidebar('planner');
    var token = grToken();
    var planId = new URLSearchParams(window.location.search).get('plan_id') || '';
    var selectedReason = '';

    var planData = null;
    try { planData = JSON.parse(sessionStorage.getItem('activePlan') || 'null'); } catch(e) {}
    if (planData) {
      document.getElementById('planBanner').style.display = '';
      document.getElementById('bannerName').textContent = (planData.stakeholder_type ? planData.stakeholder_type + ' — ' : '') + (planData.stakeholder_name || '');
      document.getElementById('bannerMeta').textContent = fmtDate(planData.meeting_date) + (planData.meeting_purpose ? '  ·  ' + planData.meeting_purpose : '');
      document.getElementById('next_stakeholder').value = planData.stakeholder_name || '';
    }

    function selectReason(el, r) {
      selectedReason = r;
      document.querySelectorAll('.reason-card').forEach(function(c) { c.classList.remove('selected'); });
      el.classList.add('selected');
      document.getElementById('postponeBox').classList.toggle('hidden', r !== 'Postponed');
      document.getElementById('alertBox').innerHTML = '';
    }

    function submitForm() {
      if (!selectedReason) { document.getElementById('alertBox').innerHTML = '<div class="alert alert-error">Please select a reason.</div>'; window.scrollTo(0,0); return; }
      if (selectedReason === 'Postponed' && !document.getElementById('next_date').value) {
        document.getElementById('alertBox').innerHTML = '<div class="alert alert-error">Please enter a next date for the postponed meeting.</div>'; return;
      }
      document.getElementById('submitBtn').disabled = true;
      document.getElementById('submitBtn').textContent = 'Saving...';

      var fd = {
        meeting_conducted: 'NO',
        date: planData ? (planData.meeting_date || '').toString().substring(0,10) : new Date().toISOString().split('T')[0],
        unit: session.unit || '',
        district: session.district || '',
        staff_name: session.full_name || '',
        conducted_by: session.designation || '',
        stakeholder_name: planData ? (planData.stakeholder_name || '') : '',
        stakeholder_type: planData ? (planData.stakeholder_type || '') : '',
        level_of_meeting: planData ? (planData.level_of_meeting || '') : '',
        block_cluster: planData ? (planData.block_cluster || '') : '',
        meeting_purpose: planData ? (planData.meeting_purpose || '') : '',
        reason_not_conducted: selectedReason,
        followup_date: document.getElementById('next_date').value,
        followup_stakeholder_name: document.getElementById('next_stakeholder').value.trim(),
        followup_notes: document.getElementById('note').value.trim()
      };

      fetch(APP_URL, { method:'POST', body: JSON.stringify({ action:'submitMeeting', token: token, plan_id: planId, formData: fd }) })
        .then(function(r) { return r.json(); }).then(function(res) {
          if (res.success) {
            sessionStorage.removeItem('activePlan');
            document.getElementById('formContainer').classList.add('hidden');
            document.getElementById('successScreen').classList.remove('hidden');
            var msg = 'Record saved.';
            if (selectedReason === 'Postponed' && res.next_plan_id) {
              msg = 'Record saved. Next meeting automatically planned for ' + fmtDate(fd.followup_date) + '.';
            }
            document.getElementById('successMsg').textContent = msg;
          } else {
            document.getElementById('alertBox').innerHTML = '<div class="alert alert-error">' + esc(res.message || 'Error') + '</div>';
            document.getElementById('submitBtn').disabled = false; document.getElementById('submitBtn').textContent = 'Save Record';
          }
        }).catch(function() {
          document.getElementById('alertBox').innerHTML = '<div class="alert alert-error">Network error. Please retry.</div>';
          document.getElementById('submitBtn').disabled = false; document.getElementById('submitBtn').textContent = 'Save Record';
        });
    }
  </script>
</body>
</html>
