<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - GR Reporting System</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .welcome-bar {
      background: linear-gradient(135deg, #922b21 0%, #c0392b 55%, #e74c3c 100%);
      color: #fff; border-radius: var(--radius); padding: 18px 20px;
      margin-bottom: 16px; box-shadow: 0 4px 20px rgba(192,57,43,0.32);
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .welcome-bar-left .greet-line { font-size: 12px; opacity: 0.82; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }
    .welcome-bar-left .name-line { font-size: 22px; font-weight: 800; line-height: 1.2; margin-top: 2px; }
    .welcome-bar-right { text-align: right; flex-shrink: 0; }
    .welcome-bar-right .date-line { font-size: 11px; opacity: 0.75; margin-bottom: 5px; }
    .wchip { display: inline-block; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.35); border-radius: 12px; padding: 3px 10px; font-size: 11px; font-weight: 700; margin-left: 4px; }

    /* COMPACT TABLE */
    .dtable tr.row-conducted td { background: #f0fdf4; }
    .dtable tr.row-conducted:hover td { background: #dcfce7; }
    .dtable tr.row-overdue td { background: #fefce8; }
    .dtable tr.row-overdue:hover td { background: #fef9c3; }
    .dtable tr.row-planned td { background: #eff6ff; }
    .dtable tr.row-planned:hover td { background: #dbeafe; }

    /* district/state breakdown */
    .team-chip { display: inline-block; background: #f1f5f9; border: 1px solid var(--border); border-radius: 20px; padding: 4px 10px; font-size: 11px; font-weight: 700; color: var(--text); margin: 2px; }

    @media (max-width: 640px) {
      .stats-row { grid-template-columns: repeat(2,1fr); }
      .qa-row { grid-template-columns: 1fr 1fr; }
      .qa-row .qa-btn:last-child { grid-column: span 2; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <button class="hamburger-btn" onclick="toggleSidebar()">&#9776;</button>
    <span class="logo">GR Reporting</span>
    <span class="nav-user" id="navUser"></span>
  </nav>
  <div class="app-layout">
    <div id="sidebarMount"></div>
    <div class="main-content">

      <!-- Welcome banner -->
      <div class="welcome-bar fade-up">
        <div class="welcome-bar-left">
          <div class="greet-line" id="greetLine">Good Morning</div>
          <div class="name-line" id="greetName">-</div>
        </div>
        <div class="welcome-bar-right">
          <div class="date-line" id="greetDate"></div>
          <div id="greetChips"></div>
        </div>
      </div>

      <!-- Role banner (district/state) -->
      <div id="roleBanner" style="display:none;"></div>

      <!-- Stats -->
      <div class="stats-row fade-up">
        <div class="scard blue">
          <div class="scard-num" id="sTotal">-</div>
          <div class="scard-label">Total</div>
        </div>
        <div class="scard green">
          <div class="scard-num" id="sConducted">-</div>
          <div class="scard-label">Conducted</div>
        </div>
        <div class="scard orange">
          <div class="scard-num" id="sUpcoming">-</div>
          <div class="scard-label">Upcoming</div>
        </div>
        <div class="scard red">
          <div class="scard-num" id="sOverdue">-</div>
          <div class="scard-label">Overdue</div>
        </div>
      </div>

      <!-- Quick Actions -->
      <div class="qa-row fade-up">
        <button class="qa-btn qa-green" onclick="location.href='formA.html'">
          <div class="qa-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          Meeting<br>Conducted
        </button>
        <button class="qa-btn qa-red" onclick="location.href='formB.html'">
          <div class="qa-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </div>
          Not<br>Conducted
        </button>
        <button class="qa-btn qa-blue" onclick="location.href='planner.html'">
          <div class="qa-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </div>
          Plan<br>Meeting
        </button>
      </div>

      <!-- Meetings Table -->
      <div class="sec-card fade-up">
        <div class="sec-head">
          <span class="sec-head-title">Manage Meetings</span>
          <a href="myentries.html" class="sec-head-link">View All</a>
        </div>
        <div id="tableSpinner" style="padding:24px;text-align:center;"><div class="spinner" style="margin:0 auto;"></div></div>
        <div id="tableWrap" style="display:none;">
          <div class="table-wrap">
            <table class="dtable">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Stakeholder</th>
                  <th>Purpose</th>
                  <th>Status</th>
                  <th>Doc</th>
                </tr>
              </thead>
              <tbody id="dashTbody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- District breakdown (district/state/admin only) -->
      <div class="sec-card fade-up" id="distCard" style="display:none;">
        <div class="sec-head">
          <span class="sec-head-title" id="distCardTitle">District Overview</span>
        </div>
        <div id="distContent" style="padding:14px;"></div>
      </div>

      <!-- Action Items -->
      <div class="sec-card fade-up" id="actionsCard" style="display:none;">
        <div class="sec-head">
          <span class="sec-head-title">Outstanding Action Items</span>
          <a href="myentries.html" class="sec-head-link">View All</a>
        </div>
        <div class="table-wrap">
          <table class="dtable">
            <thead>
              <tr><th>Action</th><th>Owner</th><th>Due</th><th>Meeting</th></tr>
            </thead>
            <tbody id="actionsTbody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script src="common.js"></script>
  <script>
    var session = requireAuth();
    renderSidebar('dashboard');

    var h = new Date().getHours();
    document.getElementById('greetLine').textContent = h < 12 ? 'Good Morning' : h < 17 ? 'Good Afternoon' : 'Good Evening';
    document.getElementById('greetName').textContent = session.full_name ? session.full_name.split(' ')[0] : (session.email || 'there');
    document.getElementById('greetDate').textContent = new Date().toLocaleDateString('en-IN', { weekday:'short', day:'numeric', month:'short', year:'numeric' });
    var chips = [];
    if (session.designation) chips.push(session.designation);
    if (session.district) chips.push(session.district);
    document.getElementById('greetChips').innerHTML = chips.map(function(c) { return '<span class="wchip">'+esc(c)+'</span>'; }).join('');

    // Role banner
    var role = session.role || 'field';
    if (role === 'district') {
      document.getElementById('roleBanner').style.display = '';
      document.getElementById('roleBanner').innerHTML = '<div class="role-banner district"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> District View: ' + esc(session.district || '') + '</div>';
    } else if (role === 'state' || role === 'admin') {
      document.getElementById('roleBanner').style.display = '';
      document.getElementById('roleBanner').innerHTML = '<div class="role-banner state"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg> ' + (role === 'admin' ? 'Admin' : 'State') + ' View: All Districts</div>';
    }

    var today = new Date(); today.setHours(0,0,0,0);
    var planData = null, meetData = null;

    function renderDashboard() {
      if (!planData || !meetData) return;
      document.getElementById('tableSpinner').style.display = 'none';
      document.getElementById('tableWrap').style.display = '';

      var conducted = 0, notDone = 0;
      meetData.forEach(function(m) {
        if (m.meeting_conducted === 'YES') conducted++;
        else if (m.meeting_conducted === 'NO') notDone++;
      });

      var upcoming = 0, overdue = 0;
      planData.forEach(function(m) {
        if (m.status === 'conducted' || m.status === 'not_conducted') return;
        var d = m.meeting_date ? new Date(m.meeting_date) : null;
        if (d) d.setHours(0,0,0,0);
        if (d && d < today) overdue++; else upcoming++;
      });

      document.getElementById('sTotal').textContent     = conducted + notDone;
      document.getElementById('sConducted').textContent = conducted;
      document.getElementById('sUpcoming').textContent  = upcoming;
      document.getElementById('sOverdue').textContent   = overdue;

      // Build meeting rows: overdue first, then upcoming
      var grpOverdue = [], grpUpcoming = [];
      planData.forEach(function(m) {
        if (m.status === 'conducted' || m.status === 'not_conducted') return;
        var d = m.meeting_date ? new Date(m.meeting_date) : null;
        if (d) d.setHours(0,0,0,0);
        if (d && d < today) grpOverdue.push(m); else grpUpcoming.push(m);
      });
      grpOverdue.sort(function(a,b) { return new Date(a.meeting_date||0) - new Date(b.meeting_date||0); });
      grpUpcoming.sort(function(a,b) { return new Date(a.meeting_date||0) - new Date(b.meeting_date||0); });
      var rows = grpOverdue.concat(grpUpcoming);

      if (!rows.length) {
        document.getElementById('dashTbody').innerHTML = '<tr class="empty-row"><td colspan="5">No pending meetings. <a href="planner.html" style="color:var(--primary);font-weight:600;">Plan one now</a></td></tr>';
      } else {
        document.getElementById('dashTbody').innerHTML = rows.map(function(m) {
          var d = m.meeting_date ? new Date(m.meeting_date) : null;
          if (d) d.setHours(0,0,0,0);
          var od = d && d < today;
          var rowClass = od ? 'row-overdue' : 'row-planned';
          var stHtml = od
            ? '<span class="st st-overdue">OVERDUE</span>'
            : '<span class="st st-planned">UPCOMING</span>';
          var docHtml = m.document_link
            ? '<a href="' + esc(m.document_link) + '" target="_blank" style="color:var(--primary);font-size:11px;font-weight:600;">PDF</a>'
            : '<span style="color:#d1d5db;">-</span>';
          return '<tr class="' + rowClass + '">'
            + '<td style="font-size:12px;font-weight:700;white-space:nowrap;">' + fmtDate(m.meeting_date) + '</td>'
            + '<td><div style="font-weight:700;font-size:13px;">' + esc(m.stakeholder_name || '') + '</div>'
            + '<div style="font-size:11px;color:var(--muted);">' + esc(m.stakeholder_type || '') + '</div></td>'
            + '<td style="font-size:12px;color:#374151;">' + esc(m.meeting_purpose || '') + '</td>'
            + '<td>' + stHtml + '</td>'
            + '<td>' + docHtml + '</td>'
            + '</tr>';
        }).join('');
      }

      // District breakdown for state/admin
      if ((role === 'state' || role === 'admin') && planData.length) {
        var byDist = {};
        planData.forEach(function(m) {
          var d = m.district || 'Unknown';
          if (!byDist[d]) byDist[d] = { total: 0, conducted: 0, overdue: 0 };
          byDist[d].total++;
          if (m.status === 'conducted') byDist[d].conducted++;
          var dd = m.meeting_date ? new Date(m.meeting_date) : null;
          if (dd) dd.setHours(0,0,0,0);
          if (m.status !== 'conducted' && m.status !== 'not_conducted' && dd && dd < today) byDist[d].overdue++;
        });
        var distNames = Object.keys(byDist).sort();
        if (distNames.length > 1) {
          document.getElementById('distCard').style.display = '';
          document.getElementById('distCardTitle').textContent = 'State Overview (' + distNames.length + ' Districts)';
          document.getElementById('distContent').innerHTML = '<div class="district-grid">' +
            distNames.map(function(dn) {
              var info = byDist[dn];
              return '<div class="dist-card">'
                + '<div class="dist-name">' + esc(dn) + '</div>'
                + '<div class="dist-nums">'
                + '<div class="dist-n"><div class="n" style="color:#2563eb;">' + info.total + '</div><div class="l">Total</div></div>'
                + '<div class="dist-n"><div class="n" style="color:#059669;">' + info.conducted + '</div><div class="l">Done</div></div>'
                + '<div class="dist-n"><div class="n" style="color:#dc2626;">' + info.overdue + '</div><div class="l">Late</div></div>'
                + '</div></div>';
            }).join('') + '</div>';
        }
      } else if (role === 'district' && planData.length) {
        // District users: show team member count
        var byUser = {};
        planData.forEach(function(m) {
          var u = m.user_email || 'Unknown';
          if (!byUser[u]) byUser[u] = 0;
          byUser[u]++;
        });
        var users = Object.keys(byUser);
        if (users.length > 1) {
          document.getElementById('distCard').style.display = '';
          document.getElementById('distCardTitle').textContent = 'Team Activity - ' + esc(session.district || 'District');
          document.getElementById('distContent').innerHTML = '<div style="padding:4px 0;">' +
            users.map(function(u) {
              return '<span class="team-chip">' + esc(u.split('@')[0]) + ': ' + byUser[u] + '</span>';
            }).join('') + '</div>';
        }
      }

      // Action items
      var pending = [];
      meetData.forEach(function(m) {
        if (m.meeting_conducted !== 'YES') return;
        var items = [];
        try { items = JSON.parse(m.action_items || '[]'); } catch(e) {}
        items.forEach(function(ai) { if (ai.action) pending.push({ ai: ai, meeting: m }); });
      });
      if (pending.length) {
        pending.sort(function(a,b) { return new Date(a.ai.due_date||'9999') - new Date(b.ai.due_date||'9999'); });
        document.getElementById('actionsTbody').innerHTML = pending.slice(0,5).map(function(p) {
          var due = p.ai.due_date ? new Date(p.ai.due_date) : null;
          if (due) due.setHours(0,0,0,0);
          var od = due && due < today;
          return '<tr class="' + (od ? 'row-overdue' : '') + '">'
            + '<td style="font-size:12px;">' + esc(p.ai.action) + '</td>'
            + '<td style="font-size:12px;">' + esc(p.ai.owner || '-') + '</td>'
            + '<td style="font-size:11px;font-weight:700;' + (od ? 'color:#dc2626;' : 'color:#374151;') + '">'
            + (p.ai.due_date ? fmtDate(p.ai.due_date) : '-') + '</td>'
            + '<td style="font-size:11px;color:var(--muted);">' + esc(p.meeting.stakeholder_name || '') + '</td>'
            + '</tr>';
        }).join('');
        document.getElementById('actionsCard').style.display = '';
      }
    }

    fetch(APP_URL, { method:'POST', body: JSON.stringify({ action:'getPlannedMeetings', token: grToken() }) })
      .then(function(r) { return r.json(); }).then(function(res) { planData = res.success ? (res.data||[]) : []; renderDashboard(); })
      .catch(function() { planData = []; renderDashboard(); });

    fetch(APP_URL, { method:'POST', body: JSON.stringify({ action:'getMyMeetings', token: grToken() }) })
      .then(function(r) { return r.json(); }).then(function(res) { meetData = res.success ? (res.data||[]) : []; renderDashboard(); })
      .catch(function() { meetData = []; renderDashboard(); });
  </script>
</body>
</html>
