<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard GR Reporting System</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .welcome-card {
      background: linear-gradient(135deg, #922b21 0%, #c0392b 60%, #e74c3c 100%);
      color: #fff; border-radius: var(--radius); padding: 18px 16px;
      margin: 4px 0 14px; box-shadow: 0 4px 16px rgba(192,57,43,0.3);
    }
    .welcome-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .welcome-greeting { font-size: 12px; opacity: 0.85; font-weight: 600; letter-spacing: 0.3px; margin-bottom: 2px; }
    .welcome-name { font-size: 20px; font-weight: 800; line-height: 1.2; }
    .welcome-right { text-align: right; flex-shrink: 0; }
    .welcome-date { font-size: 11px; opacity: 0.78; margin-bottom: 4px; }
    .welcome-chip { display: inline-block; background: rgba(255,255,255,0.22); border: 1px solid rgba(255,255,255,0.38); border-radius: 12px; padding: 2px 10px; font-size: 11px; font-weight: 700; }

    /* 4 stat boxes */
    .dash-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
    .dash-box { background: #fff; border-radius: var(--radius); padding: 14px 10px 12px; box-shadow: var(--shadow); text-align: center; border-top: 3px solid var(--primary); }
    .dash-box.green  { border-top-color: var(--success); }
    .dash-box.orange { border-top-color: var(--warning); }
    .dash-box.red    { border-top-color: var(--danger); }
    .dash-icon  { font-size: 18px; margin-bottom: 4px; }
    .dash-num   { font-size: 28px; font-weight: 800; color: var(--primary); line-height: 1; }
    .dash-box.green  .dash-num { color: var(--success); }
    .dash-box.orange .dash-num { color: var(--warning); }
    .dash-box.red    .dash-num { color: var(--danger); }
    .dash-label { font-size: 10px; font-weight: 600; color: var(--muted); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.3px; }

    /* Table */
    .section-card { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 14px; }
    .section-head { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .section-head-title { font-size: 14px; font-weight: 700; }
    .section-head-link { font-size: 12px; color: var(--primary); font-weight: 600; text-decoration: none; }
    .mtable { width: 100%; border-collapse: collapse; font-size: 13px; }
    .mtable th { background: #f9fafb; padding: 8px 10px; text-align: left; font-weight: 700; border-bottom: 2px solid var(--border); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; white-space: nowrap; }
    .mtable td { padding: 9px 10px; border-bottom: 1px solid #f3f4f6; vertical-align: middle; }
    .mtable tr:last-child td { border-bottom: none; }
    .mtable tr:hover td { background: #fafafa; }
    .mstk-name { font-weight: 600; font-size: 13px; }
    .mstk-type { font-size: 11px; color: var(--muted); }
    .mpurpose  { font-size: 12px; color: #374151; }
    .date-line { font-size: 12px; font-weight: 600; white-space: nowrap; }
    .overdue-tag { background: #fef2f2; color: var(--danger); font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 8px; display: inline-block; margin-top: 2px; }
    .st-conducted    { background: #ecfdf5; color: #065f46; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 10px; white-space: nowrap; display: inline-block; }
    .st-not-done     { background: #fdf2f2; color: #7b1f1f; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 10px; white-space: nowrap; display: inline-block; }
    .st-upcoming     { background: #fffbeb; color: #92400e;  font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 10px; white-space: nowrap; display: inline-block; }
    .st-overdue      { background: #fef2f2; color: var(--danger); font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 10px; white-space: nowrap; display: inline-block; }
    .doc-link  { color: var(--primary); text-decoration: none; font-size: 11px; font-weight: 600; }
    .doc-link:hover { text-decoration: underline; }
    .empty-row td { text-align: center; padding: 28px 16px; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <nav class="navbar">
    <button class="hamburger-btn" onclick="toggleSidebar()">&#9776;</button>
    <span class="logo">GR Reporting</span>
    <span class="nav-user" id="navUser"></span>
  </nav>
  <div class="app-layout">
    <div id="sidebarMount"></div>
    <div class="main-content">

      <div class="welcome-card">
        <div class="welcome-row">
          <div>
            <div class="welcome-greeting" id="greetLabel">Good Morning,</div>
            <div class="welcome-name" id="greetName">—</div>
          </div>
          <div class="welcome-right">
            <div class="welcome-date" id="greetDate"></div>
            <div id="greetChips"></div>
          </div>
        </div>
      </div>

      <!-- 4 stat boxes -->
      <div class="dash-grid">
        <div class="dash-box">
          <div class="dash-icon" style="color:var(--primary);">&#128197;</div>
          <div class="dash-num" id="sTotal">—</div>
          <div class="dash-label">Total Planned</div>
        </div>
        <div class="dash-box green">
          <div class="dash-icon" style="color:var(--success);">&#10003;</div>
          <div class="dash-num" id="sConducted">—</div>
          <div class="dash-label">Conducted</div>
        </div>
        <div class="dash-box orange">
          <div class="dash-icon" style="color:var(--warning);">&#9201;</div>
          <div class="dash-num" id="sUpcoming">—</div>
          <div class="dash-label">Upcoming</div>
        </div>
        <div class="dash-box red">
          <div class="dash-icon" style="color:var(--danger);">&#9888;</div>
          <div class="dash-num" id="sOverdue">—</div>
          <div class="dash-label">Overdue</div>
        </div>
      </div>

      <!-- Meeting Table -->
      <div class="section-card">
        <div class="section-head">
          <span class="section-head-title">Upcoming Meetings</span>
          <a href="planner.html" class="section-head-link">+ Plan New &nbsp;&#8250;</a>
        </div>
        <div id="tableSpinner" style="padding:20px;text-align:center;"><div class="spinner" style="margin:0 auto;"></div></div>
        <div class="table-wrap" id="tableWrap" style="display:none;">
          <table class="mtable">
            <thead>
              <tr>
                <th>Date</th>
                <th>Who to Meet</th>
                <th>Purpose</th>
                <th>Status</th>
                <th>Doc</th>
              </tr>
            </thead>
            <tbody id="dashTbody"></tbody>
          </table>
        </div>
      </div>

      <!-- Outstanding Action Items -->
      <div class="section-card" id="actionsCard" style="display:none;">
        <div class="section-head">
          <span class="section-head-title">&#128203; Outstanding Action Items</span>
          <a href="myentries.html" class="section-head-link">View All &nbsp;&#8250;</a>
        </div>
        <div class="table-wrap">
          <table class="mtable">
            <thead>
              <tr>
                <th>Action</th>
                <th>Owner</th>
                <th>Due</th>
                <th>Meeting</th>
              </tr>
            </thead>
            <tbody id="actionsTbody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script src="common.js"></script>
  <script>
    var session = requireAuth();
    renderSidebar('dashboard');

    var h = new Date().getHours();
    document.getElementById('greetLabel').textContent = h < 12 ? 'Good Morning,' : h < 17 ? 'Good Afternoon,' : 'Good Evening,';
    document.getElementById('greetName').textContent = session.full_name ? session.full_name.split(' ')[0] : (session.email || 'there');
    document.getElementById('greetDate').textContent = new Date().toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
    var chips = [];
    if (session.designation) chips.push(session.designation);
    if (session.district) chips.push(session.district);
    document.getElementById('greetChips').innerHTML = chips.map(function(c) {
      return '<span class="welcome-chip" style="margin-left:4px;">' + esc(c) + '</span>';
    }).join('');

    fetch(APP_URL, { method: 'POST', body: JSON.stringify({ action: 'getPlannedMeetings', token: grToken() }) })
      .then(function(r) { return r.json(); }).then(function(res) {
        document.getElementById('tableSpinner').classList.add('hidden');
        document.getElementById('tableWrap').style.display = '';
        if (!res.success) {
          document.getElementById('dashTbody').innerHTML = '<tr class="empty-row"><td colspan="5">Could not load meetings.</td></tr>';
          return;
        }
        var meetings = res.data || [];
        var today = new Date(); today.setHours(0, 0, 0, 0);

        var total = 0, conducted = 0, upcoming = 0, overdue = 0;
        meetings.forEach(function(m) {
          total++;
          if (m.status === 'conducted') { conducted++; return; }
          if (m.status === 'not_conducted') return;
          var d = m.meeting_date ? new Date(m.meeting_date) : null;
          if (d) d.setHours(0, 0, 0, 0);
          if (d && d < today) overdue++; else upcoming++;
        });
        document.getElementById('sTotal').textContent = total;
        document.getElementById('sConducted').textContent = conducted;
        document.getElementById('sUpcoming').textContent = upcoming;
        document.getElementById('sOverdue').textContent = overdue;

        // Filter: only upcoming and overdue (not already conducted / not_conducted)
        var grpOverdue = [], grpUpcoming = [];
        meetings.forEach(function(m) {
          if (m.status === 'conducted' || m.status === 'not_conducted') return;
          var d = m.meeting_date ? new Date(m.meeting_date) : null;
          if (d) d.setHours(0, 0, 0, 0);
          if (d && d < today) grpOverdue.push(m);
          else grpUpcoming.push(m);
        });
        grpOverdue.sort(function(a,b) { return new Date(a.meeting_date||0) - new Date(b.meeting_date||0); });
        grpUpcoming.sort(function(a,b) { return new Date(a.meeting_date||0) - new Date(b.meeting_date||0); });
        var sorted = grpOverdue.concat(grpUpcoming);

        if (sorted.length === 0) {
          document.getElementById('dashTbody').innerHTML = '<tr class="empty-row"><td colspan="5">Koi upcoming meeting nahi hai. <a href="planner.html" style="color:var(--primary);">Plan karo</a></td></tr>';
          return;
        }

        var html = '';
        sorted.forEach(function(m) {
          var d = m.meeting_date ? new Date(m.meeting_date) : null;
          if (d) d.setHours(0, 0, 0, 0);
          var isPending = m.status !== 'conducted' && m.status !== 'not_conducted';
          var isOverdue = isPending && d && d < today;

          var statusHtml;
          if (m.status === 'conducted') statusHtml = '<span class="st-conducted">&#10003; Done</span>';
          else if (m.status === 'not_conducted') statusHtml = '<span class="st-not-done">&#10007; Not Done</span>';
          else if (isOverdue) statusHtml = '<span class="st-overdue">Overdue</span>';
          else statusHtml = '<span class="st-upcoming">Upcoming</span>';

          var docHtml = m.document_link
            ? '<a href="' + esc(m.document_link) + '" target="_blank" class="doc-link">PDF</a>'
            : '<span style="color:#d1d5db;">—</span>';

          html += '<tr>'
            + '<td><div class="date-line">' + fmtDate(m.meeting_date) + '</div>'
              + (isOverdue ? '<div class="overdue-tag">Overdue</div>' : '') + '</td>'
            + '<td><div class="mstk-name">' + esc(m.stakeholder_name || '') + '</div>'
              + '<div class="mstk-type">' + esc(m.stakeholder_type || '') + '</div></td>'
            + '<td><div class="mpurpose">' + esc(m.meeting_purpose || '') + '</div></td>'
            + '<td>' + statusHtml + '</td>'
            + '<td>' + docHtml + '</td>'
            + '</tr>';
        });
        document.getElementById('dashTbody').innerHTML = html;

        // Load outstanding action items from logged meetings
        fetch(APP_URL, { method:'POST', body: JSON.stringify({ action:'getMyMeetings', token: grToken() }) })
          .then(function(r) { return r.json(); }).then(function(mr) {
            if (!mr.success) return;
            var today = new Date(); today.setHours(0,0,0,0);
            var pending = [];
            (mr.data || []).forEach(function(m) {
              if (m.meeting_conducted !== 'YES') return;
              var items = [];
              try { items = JSON.parse(m.action_items || '[]'); } catch(e) {}
              items.forEach(function(ai) {
                if (ai.action) pending.push({ ai: ai, meeting: m });
              });
            });
            if (!pending.length) return;
            // Sort by due date ascending
            pending.sort(function(a,b) { return new Date(a.ai.due_date||'9999') - new Date(b.ai.due_date||'9999'); });
            var top = pending.slice(0, 5);
            var ahtml = '';
            top.forEach(function(p) {
              var due = p.ai.due_date ? new Date(p.ai.due_date) : null;
              if (due) due.setHours(0,0,0,0);
              var overdue = due && due < today;
              var dueStr = p.ai.due_date ? fmtDate(p.ai.due_date) : '—';
              ahtml += '<tr>'
                + '<td style="font-size:12px;">' + esc(p.ai.action) + '</td>'
                + '<td style="font-size:12px;">' + esc(p.ai.owner || '—') + '</td>'
                + '<td><span style="font-size:11px;font-weight:700;' + (overdue ? 'color:var(--danger);' : 'color:#374151;') + '">' + dueStr + (overdue ? ' &#9888;' : '') + '</span></td>'
                + '<td style="font-size:11px;color:var(--muted);">' + esc(p.meeting.stakeholder_name || '') + '</td>'
                + '</tr>';
            });
            document.getElementById('actionsTbody').innerHTML = ahtml;
            document.getElementById('actionsCard').style.display = '';
          }).catch(function() {});
      }).catch(function() {
        document.getElementById('tableSpinner').classList.add('hidden');
        document.getElementById('tableWrap').style.display = '';
        ['sTotal','sConducted','sUpcoming','sOverdue'].forEach(function(id) {
          document.getElementById(id).textContent = '0';
        });
        document.getElementById('dashTbody').innerHTML = '<tr class="empty-row"><td colspan="5">Network error. Please refresh.</td></tr>';
      });
  </script>
</body>
</html>
